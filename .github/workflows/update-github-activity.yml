name: Update GitHub Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-github-activity.py"
      - ".github/workflows/update-github-activity.yml"

permissions:
  contents: write

concurrency:
  group: github-activity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate activity SVGs
        env:
          PROFILE_REPOS_TOKEN: ${{ secrets.PROFILE_REPOS_TOKEN }}
        run: |
          python scripts/generate-github-activity.py

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity/*.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update github activity"
          git pull --rebase
          git push
